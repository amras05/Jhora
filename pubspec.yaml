name: jhora_mobile
description: "Jhora Mobile - Vedic Astrology App inspired by Jagannatha Hora"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  intl: ^0.19.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_animate: ^4.3.0
  http: ^1.6.0
  pdf: ^3.11.3
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/
